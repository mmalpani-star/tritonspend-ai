# Render Blueprint for the TritonSpend FastAPI backend (backend/app/main.py).
#
# - Runs from the repository root: the app imports both `backend.app` (source tree) and
#   `tritonspend.core` (installed from src/ by `pip install ".[backend]"`).
# - Migrations are NOT run on deploy. Apply them deliberately with `alembic upgrade head`
#   against the Neon *direct* connection string, after approval (see HANDOFF.md).
# - Secrets: the session and CSRF secrets are generated by Render (never committed or printed).
#   Values marked `sync: false` are entered in the Render dashboard when the Blueprint is created.
# - The frontend (Vercel) proxies /api/* to this service, so the browser only ever talks to the
#   frontend's own origin; CORS/PUBLIC_ORIGIN therefore name the Vercel origin(s), not Render's.
services:
  - type: web
    name: tritonspend-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install ".[backend]"
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TRITONSPEND_ENV
        value: production
      - key: TRITONSPEND_TIMEZONE
        value: America/Los_Angeles
      - key: TRITONSPEND_SESSION_SECRET
        generateValue: true
      - key: TRITONSPEND_CSRF_SECRET
        generateValue: true
      # Neon *pooled* connection string (host contains "-pooler"), e.g.
      # postgresql://USER:PASSWORD@ep-xxxx-pooler.us-west-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Comma-separated HTTPS origins of the Vercel site, e.g.
      # https://tritonspend-ai.vercel.app,https://tritonspend-ai-git-<branch>-<team>.vercel.app
      - key: TRITONSPEND_CORS_ORIGINS
        sync: false
      # The production Vercel origin; must also appear in TRITONSPEND_CORS_ORIGINS.
      - key: TRITONSPEND_PUBLIC_ORIGIN
        sync: false
      - key: TRITONSPEND_CONSENT_VERSION
        sync: false
      # Absolute HTTPS URL of the approved consent document.
      - key: TRITONSPEND_CONSENT_DOCUMENT_URL
        sync: false
      # Optional: TRITONSPEND_CONSENT_DOCUMENT_HASH, TRITONSPEND_FOOD_MODERATOR_EMAILS.
