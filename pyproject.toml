[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tritonspend"
version = "0.1.0"
description = "Deterministic dining-budget planning domain"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=8"]
backend = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]
backend-test = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
